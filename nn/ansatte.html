  </script>
  <script type="application/ld+json">
    {"@context": "https://schema.org", "@type": "LocalBusiness", "name": "FjordFix AS", "url": "https://fjordfix.com/", "logo": "https://fjordfix.com/logo_white.png", "image": "https://fjordfix.com/Logo.png?v=20260302", "email": "kris@fjordfix.com", "areaServed": ["Knarvik", "Alver", "Asane", "Lindas", "Frekhaug", "Manger"]}
  </script>
<style>
    :root{--orange:#165A74;--ink:#0f172a;--muted:#475569;--line:rgba(15,23,42,.12);--surface-04:rgba(15,23,42,.06);--shadow:0 18px 60px rgba(15,23,42,.12);--bg:#ffffff;--card:#ffffff;--panel:#ffffff}
    *{box-sizing:border-box}
    body{margin:0;font-family:"Poppins",ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial;color:var(--ink);background:var(--bg)}

    const root = document.documentElement;

    const menuButton = document.querySelector('[data-menu-toggle]');
    const menuPanel = document.querySelector('[data-menu-panel]');
    const closeMenu = () => {
      if (!menuButton || !menuPanel) return;
      menuButton.setAttribute('aria-expanded', 'false');
      menuPanel.hidden = true;
    };
    if (menuButton && menuPanel) {
      menuButton.addEventListener('click', (event) => {
        event.stopPropagation();
        if (langPanel && langToggle) {
          langToggle.setAttribute('aria-expanded', 'false');
          langPanel.hidden = true;
        }
        const isOpen = menuButton.getAttribute('aria-expanded') === 'true';
        menuButton.setAttribute('aria-expanded', String(!isOpen));
        menuPanel.hidden = isOpen;
      });
      document.addEventListener('click', (event) => {
        if (menuPanel.contains(event.target) || menuButton.contains(event.target)) return;
        closeMenu();
      });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') closeMenu();
      });
      menuPanel.addEventListener('click', (event) => {
        if (event.target && event.target.tagName === 'A') closeMenu();
      });
    }

    const tbody = document.querySelector('[data-requests]');
    const sheetsEndpoint = 'https://script.google.com/macros/s/AKfycbx990wNsgUbjKyHhbOnG8LkfSbqGIm4975GSf01yosZkAQUbi0tIFX2fr9PDT41VVTq/exec';

    const loadRequests = async () => {
      try {
        const res = await fetch(sheetsEndpoint);
        if (!res.ok) throw new Error('Bad response');
        const data = await res.json();
        const records = Array.isArray(data) ? data : (data.records || []);
        localStorage.setItem('fjordfix-requests', JSON.stringify(records));
        return records;
      } catch (err) {
        const stored = localStorage.getItem('fjordfix-requests');
        return stored ? JSON.parse(stored) : [];
      }
    };
    let requests = [];

    const startOfWeek = (date) => {
      const d = new Date(date);
      const day = (d.getDay() + 6) % 7;
      d.setHours(0, 0, 0, 0);
      d.setDate(d.getDate() - day);
      return d;
    };
    let currentWeek = startOfWeek(new Date());

    const formatRange = (date) => {
      const start = new Date(date);
      const end = new Date(date);
      end.setDate(end.getDate() + 6);
      const opts = { day: '2-digit', month: 'short' };
      return `${start.toLocaleDateString('no-NO', opts)} – ${end.toLocaleDateString('no-NO', opts)}`;
    };


    const shortType = (value) => {
      if (!value) return '';
      const raw = String(value).trim();
      if (raw === 'A' || raw === 'O') return raw;
      const lower = raw.toLowerCase();
      if (lower.includes('vedlikehaldsavtale')) return 'A';
      if (lower.includes('vedlikeholdsavtale')) return 'A';
      if (lower.includes('enkeltoppdrag')) return 'O';
      if (lower.includes('maintenance')) return 'A';
      if (lower.includes('one')) return 'O';
      if (lower.includes('avtale')) return 'A';
      if (lower.includes('oppdrag')) return 'O';
      return raw;
    };
    const cleanDate = (value) => (value && /^\d{4}-\d{2}-\d{2}$/.test(value) ? value : '');
    const cleanTime = (value) => (value && /^\d{2}:\d{2}$/.test(value) ? value : '');

    const serviceOptions = [
      '🛠️ SmåFix',
      '🌿 HageFix',
      'Annet',
    ];
    const typeOptions = ['A', 'O'];
    const escapeHtml = (value) => String(value || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    const displayName = (item) => item.navn || [item.fornavn, item.etternavn].filter(Boolean).join(' ');
    const displayAddress = (item) => item.adresse || [item.gateadresse, item.postkode, item.sted].filter(Boolean).join(', ');
    const buildOptions = (current, options) => {
      const unique = Array.from(new Set(options));
      const currentValue = current || '';
      if (currentValue && !unique.includes(currentValue)) unique.unshift(currentValue);
      return unique.map((option) => {
        const selected = option === currentValue ? ' selected' : '';
        return `<option value="${escapeHtml(option)}"${selected}>${escapeHtml(option)}</option>`;
      }).join('');
    };

    const renderTable = () => {
      if (!tbody) return;
      if (!requests.length) return;
      tbody.innerHTML = '';
      requests.forEach((item, idx) => {
        const missing = !(item.startdato || item.dato) || !item.start || !item.slutt;
        const row = document.createElement('tr');
        row.innerHTML = `
          <td><button class="info-btn" type="button" data-info-index="${idx}">Meir info</button></td>
          <td>${displayName(item) || ''}</td>
          <td>${displayAddress(item) || ''}</td>
          <td>
            <select class="edit-select" data-index="${idx}" data-field="tjeneste" data-prev="${escapeHtml(item.tjeneste || '')}">
              ${buildOptions(item.tjeneste || '', serviceOptions)}
            </select>
          </td>
          <td>
            <select class="edit-select" data-index="${idx}" data-field="type" data-prev="${escapeHtml(shortType(item.type) || '')}">
              ${buildOptions(shortType(item.type) || '', typeOptions)}
            </select>
          </td>
          <td>
            <input class="date-input" type="date" data-index="${idx}" data-field="startdato" value="${cleanDate(item.startdato || item.dato)}" autocomplete="off">
          </td>
          <td>
            <input class="time-input" type="time" data-index="${idx}" data-field="start" value="${cleanTime(item.start)}" autocomplete="off">
          </td>
          <td>
            <input class="date-input" type="date" data-index="${idx}" data-field="sluttdato" value="${cleanDate(item.sluttdato)}" autocomplete="off">
          </td>
          <td>
            <input class="time-input" type="time" data-index="${idx}" data-field="slutt" value="${cleanTime(item.slutt)}" autocomplete="off">
            <span class="warn ${missing ? 'is-visible' : ''}" title="Mangler tid">!</span>
          </td>
          <td>
            <select class="status" data-index="${idx}">
              <option value="ny">Ny</option>
              <option value="kontaktet">Kontaktet</option>
              <option value="avtalt">Avtalt</option>
              <option value="fakturert">Fakturert</option>
              <option value="utfort">Utført</option>
            </select>
            <span class="warn ${String(item.status || '').toLowerCase() === 'ny' ? 'is-visible' : ''}" title="Påminning: kontakt kunden">!</span>
          </td>
          <td>
            ${item.status === 'utfort' ? '<button class="delete-btn" type="button" data-delete-id="' + (item.id || '') + '">Slett</button>' : ''}
          </td>
        `;
        const statusSelect = row.querySelector('select.status');
        if (statusSelect) statusSelect.value = (item.status || 'ny').toLowerCase();
        tbody.appendChild(row);

        const detailRow = document.createElement('tr');
        detailRow.className = 'detail-row';
        detailRow.hidden = true;
        detailRow.innerHTML = `
          <td colspan="11">
            <div class="detail-card">
              <div><strong>Fornamn:</strong> ${escapeHtml(item.fornavn || '')}</div>
              <div><strong>Etternamn:</strong> ${escapeHtml(item.etternavn || '')}</div>
              <div><strong>Telefon:</strong> ${escapeHtml(item.telefon || '')}</div>
              <div><strong>E-post:</strong> ${escapeHtml(item.email || '')}</div>
              <div><strong>Gateadresse:</strong> ${escapeHtml(item.gateadresse || '')}</div>
              <div><strong>Postkode:</strong> ${escapeHtml(item.postkode || '')}</div>
              <div><strong>Stad:</strong> ${escapeHtml(item.sted || '')}</div>
              <div><strong>Kort skildring:</strong> ${escapeHtml(item.beskrivelse || item.kommentar || '')}</div>
              <div class="note-label">Kundenotat</div>
              <textarea class="note-input" data-index="${idx}" data-field="kundenotat" placeholder="Skriv notat her...">${escapeHtml(item.kundenotat || '')}</textarea>
            </div>
          </td>
        `;
        tbody.appendChild(detailRow);
      });
    };


    const syncUpdate = (payload) => {
      if (!payload.id) return;
      const body = new URLSearchParams({ action: 'update', ...payload });
      fetch(sheetsEndpoint, { method: 'POST', body });
    };
    const syncDelete = (id) => {
      if (!id) return;
      const body = new URLSearchParams({ action: 'delete', id });
      fetch(sheetsEndpoint, { method: 'POST', body });
    };

    const init = async () => {
      requests = await loadRequests();
      renderTable();
    };
    init();

    if (tbody) {
      tbody.addEventListener('click', (event) => {
        const target = event.target;
        if (!target) return;
        const infoIndex = target.getAttribute('data-info-index');
        if (infoIndex !== null) {
          const row = target.closest('tr');
          const detailRow = row ? row.nextElementSibling : null;
          if (detailRow && detailRow.classList.contains('detail-row')) {
            detailRow.hidden = !detailRow.hidden;
          }
        }
      });
      tbody.addEventListener('change', (event) => {
        const target = event.target;
        if (!target) return;
        const index = Number(target.getAttribute('data-index'));
        if (Number.isNaN(index)) return;
        requests = requests.length ? requests : [];
        if (target.classList.contains('status')) {
          requests[index].status = target.value;
          syncUpdate({ id: requests[index].id, status: target.value });
        } else if (target.dataset.field) {
          if (target.dataset.field === 'tjeneste' || target.dataset.field === 'type') {
            const fieldLabel = target.dataset.field === 'tjeneste' ? 'teneste' : 'type';
            const ok = window.confirm(`Du er i ferd med å endre ${fieldLabel} for vald kunde. Ønskjer du å bekrefte handlinga?`);
            if (!ok) {
              target.value = target.dataset.prev || '';
              return;
            }
            target.dataset.prev = target.value;
          }
          requests[index][target.dataset.field] = target.value;
          syncUpdate({ id: requests[index].id, [target.dataset.field]: target.value });
        }
        localStorage.setItem('fjordfix-requests', JSON.stringify(requests));
        renderTable();
      });
      tbody.addEventListener('click', (event) => {
        const btn = event.target.closest('.delete-btn');
        if (!btn) return;
        event.preventDefault();
        const id = btn.getAttribute('data-delete-id');
        const ok = window.confirm('Du er i ferd med å slette denne forespørselen og kundedata vil gå tapt. Er du sikker på at du ønsker å gå videre med sletting?');
        if (!ok) return;
        requests = requests.filter((item) => item.id !== id);
        localStorage.setItem('fjordfix-requests', JSON.stringify(requests));
        syncDelete(id);
        renderTable();
      });
    }

    const commentModal = document.querySelector('[data-comment-modal]');
    const commentText = document.querySelector('[data-comment-text]');
    const commentClose = document.querySelector('[data-comment-close]');
    if (commentModal && commentText && commentClose && tbody) {
      tbody.addEventListener('click', (event) => {
        const btn = event.target.closest('.comment-btn');
        if (!btn) return;
        event.preventDefault();
        const text = btn.getAttribute('data-comment') || '';
        commentText.textContent = text;
        commentModal.classList.add('is-open');
      });
      commentClose.addEventListener('click', () => {
        commentModal.classList.remove('is-open');
      });
      commentModal.addEventListener('click', (event) => {
        if (event.target === commentModal) commentModal.classList.remove('is-open');
      });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') commentModal.classList.remove('is-open');
      });
    }
  </script>
</body>
</html>
